<button
  type="button"
  class="music-toggle"
  [class.is-playing]="isMusicPlaying()"
  [attr.aria-pressed]="isMusicPlaying()"
  aria-label="Silenciar o activar la música"
  (click)="toggleMusic()"
>
  @if (isMusicPlaying()) {
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path
        d="M9 18V6l10-2v12"
        stroke="currentColor"
        stroke-width="1.6"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <circle cx="6.5" cy="18" r="2.5" stroke="currentColor" stroke-width="1.6" />
      <circle cx="16.5" cy="16" r="2.5" stroke="currentColor" stroke-width="1.6" />
    </svg>
  } @else {
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path
        d="M9 18V6l10-2v12"
        stroke="currentColor"
        stroke-width="1.6"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <circle cx="6.5" cy="18" r="2.5" stroke="currentColor" stroke-width="1.6" />
      <circle cx="16.5" cy="16" r="2.5" stroke="currentColor" stroke-width="1.6" />
      <line x1="3.5" y1="3.5" x2="20.5" y2="20.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
    </svg>
  }
</button>

<app-envelope-intro (opened)="isEnvelopeOpened.set(true)" />

@if (isEnvelopeOpened()) {
  <app-cover />
  <app-welcome (itineraryRequested)="scrollToItinerary()" />

  <div class="location-prices-itinerary-bg" id="itinerary-location">
    <app-location />
    <app-prices />
    <app-itinerary />
  </div>

  <div class="gift-dress-bg">
    <app-gift-registry />
    <app-dress-code />
  </div>
  <app-rsvp />
  <app-countdown-closing />
}
