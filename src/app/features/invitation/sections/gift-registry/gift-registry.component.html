<section class="gift">
  <div class="gift__scene">
    <img class="gift__flower gift__flower--top" src="/img/photos/flor.png" alt="" />

    <div class="gift__card">
      <img class="gift__card-bg" src="/img/photos/libreta.png" alt="" />

      <img class="gift__title" src="/img/photos/mesa_regalos.webp" alt="Mesa de regalos" />

      <p class="gift__message">{{ message }}</p>

      <button type="button" class="gift__button" (click)="openModal()">{{ buttonText }}</button>
    </div>

    <img class="gift__flower gift__flower--bottom" src="/img/photos/flor.png" alt="" />
  </div>
</section>

@if (isModalOpen()) {
  <div class="gift-modal" (click)="closeModal()">
    <div
      class="gift-modal__panel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="gift-modal-title"
      (click)="$event.stopPropagation()"
    >
      <button type="button" class="gift-modal__close" aria-label="Cerrar" (click)="closeModal()">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
        </svg>
      </button>

      <app-ornament-divider class="gift-modal__ornament" />
      <p class="gift-modal__title" id="gift-modal-title">Mesa de regalos</p>
      <p class="gift-modal__subtitle">Algunas ideas para acompañarnos</p>

      <ol class="gift-modal__list">
        @for (item of items; track item) {
          <li class="gift-modal__item">{{ item }}</li>
        }
      </ol>

      <p class="gift-modal__alias-message">{{ aliasMessage }}</p>
      <div class="gift-modal__alias">
        <p class="gift-modal__alias-value">{{ alias }}</p>

        <button
          type="button"
          class="gift-modal__alias-copy"
          [class.is-copied]="aliasCopied()"
          [attr.aria-label]="aliasCopied() ? 'Alias copiado' : 'Copiar alias'"
          (click)="copyAlias()"
        >
          @if (aliasCopied()) {
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M5 12.5l4.5 4.5L19 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          } @else {
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <rect x="9" y="9" width="11" height="11" rx="2" stroke="currentColor" stroke-width="1.7" />
              <path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
            </svg>
          }
        </button>
      </div>

      @if (buttonUrl && buttonUrl !== '#') {
        <a class="gift-modal__link" [href]="buttonUrl" target="_blank" rel="noopener">Ir a {{ storeName }}</a>
      }
    </div>
  </div>
}
