<section class="closing">
  <img class="closing__bg" src="/img/photos/fondo_final.webp" alt="" aria-hidden="true" width="839" height="1386" />

  <div class="closing__scene">
    <p class="closing__title">Nuestro para siempre<br />comienza en...</p>

    <div class="closing__countdown">
      <div class="closing__unit">
        <p class="closing__value">{{ days() }}</p>
        <p class="closing__label">Días</p>
      </div>
      <span class="closing__colon" aria-hidden="true">:</span>
      <div class="closing__unit">
        <p class="closing__value">{{ hours() }}</p>
        <p class="closing__label">Horas</p>
      </div>
      <span class="closing__colon" aria-hidden="true">:</span>
      <div class="closing__unit">
        <p class="closing__value">{{ minutes() }}</p>
        <p class="closing__label">Minutos</p>
      </div>
      <span class="closing__colon" aria-hidden="true">:</span>
      <div class="closing__unit">
        <p class="closing__value">{{ seconds() }}</p>
        <p class="closing__label">Segundos</p>
      </div>
    </div>

    <div class="closing__heart">
      <img class="closing__heart-bg" src="/img/photos/cora_final.png" alt="" aria-hidden="true" width="1007" height="1019" />
      <p class="closing__heart-text">¡Con amor de,<br />Valen y Lauti!</p>
    </div>
  </div>
</section>
