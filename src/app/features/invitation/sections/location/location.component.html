<section class="location">
  <div class="location__card">
    <div class="location__schedule">
      <p class="location__schedule-label">{{ scheduleLabel }}</p>
      <p class="location__schedule-time">{{ scheduleTime }}</p>
    </div>

    <p class="location__title">Ubicación</p>
    <p class="location__venue">{{ venueName }}</p>
    <p class="location__address">{{ address }}</p>

    <a class="location__button" [href]="buttonUrl" target="_blank" rel="noopener">{{ buttonText }}</a>

    <!-- Carrousel: las fotos van dentro del hueco del encaje
         (ver INVITATION_CONFIG.location.photos). -->
    <div class="location__carousel">
      <img class="location__wings" src="/img/photos/carrousel-alas.png" alt="" aria-hidden="true" />
      <div
        class="location__frame"
        (touchstart)="onTouchStart($event)"
        (touchend)="onTouchEnd($event)"
      >
        <img class="location__frame-lace" src="/img/photos/carrousel-marco.png" alt="" aria-hidden="true" />
        <div class="location__window">
          @for (photo of photos; track photo; let i = $index) {
            <img
              class="location__photo"
              [class.location__photo--active]="i === current()"
              [src]="photo"
              [alt]="'Foto ' + (i + 1) + ' de ' + photos.length"
              [attr.aria-hidden]="i !== current()"
              loading="lazy"
            />
          }
        </div>
        @if (photos.length > 1) {
          <div class="location__dots">
            @for (photo of photos; track photo; let i = $index) {
              <button
                type="button"
                class="location__dot"
                [class.location__dot--active]="i === current()"
                [attr.aria-label]="'Ver foto ' + (i + 1)"
                [attr.aria-current]="i === current()"
                (click)="goTo(i)"
              ></button>
            }
          </div>
        }
      </div>
    </div>

    <img class="location__map" src="/img/photos/mapa-lugar.png" [alt]="'Boceto de ' + venueName" />
  </div>
</section>
