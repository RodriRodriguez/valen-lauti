<section class="prices">
  <div class="prices__card">
    <app-ornament-divider class="prices__ornament" />

    <p class="prices__title">{{ title }}</p>
    <p class="prices__subtitle">{{ subtitle }}</p>

    <ul class="prices__list">
      @for (tier of tiers; track tier.range) {
        <li class="prices__tier">
          <p class="prices__range">{{ tier.range }}</p>
          <p class="prices__amount">{{ tier.amount }}</p>
          <p class="prices__child">Niños (3 a 10 años): {{ tier.childAmount }}</p>
        </li>
      }
    </ul>

    <div class="prices__notes">
      @for (note of notes; track note) {
        <p class="prices__note">{{ note }}</p>
      }
    </div>

    <p class="prices__alias-label">Alias para transferencia</p>
    <div class="prices__alias">
      <p class="prices__alias-value">{{ alias }}</p>

      <button
        type="button"
        class="prices__alias-copy"
        [class.is-copied]="aliasCopied()"
        [attr.aria-label]="aliasCopied() ? 'Alias copiado' : 'Copiar alias'"
        (click)="copyAlias()"
      >
        @if (aliasCopied()) {
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M5 12.5l4.5 4.5L19 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect x="9" y="9" width="11" height="11" rx="2" stroke="currentColor" stroke-width="1.7" />
            <path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
          </svg>
        }
      </button>
    </div>
  </div>
</section>
